name: Quality gate timeout regression
on:
  pull_request:
    paths:
      - 'scripts/quality_gate.py'
      - 'tests/test_quality_gate_timeouts.py'
      - '.github/workflows/quality-gate-timeouts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded optional syntax-check tests
        run: python -m unittest discover -s tests -p 'test_quality_gate_timeouts.py' -v
