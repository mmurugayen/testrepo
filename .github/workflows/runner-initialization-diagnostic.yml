name: Runner initialization diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/runner-initialization-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm runner started
        run: |
          echo "Runner initialized"
          python3 --version
          echo "Diagnostic complete"
