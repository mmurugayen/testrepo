name: Observability contracts
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
# Coalesce obsolete automatic revisions without cancelling manual qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  diagnostics:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Verify source boundaries and shared-source provenance
        run: python3 scripts/check_observability_coverage.py
      - name: Exercise MCP transport, privacy and operation semantics
        run: |
          python3 -m unittest discover -s tests -p 'test_observability_mcp.py' -v
          python3 -m unittest discover -s tests -p 'test_operation_tracing.py' -v
      - name: Exercise browser HTTP diagnostics when present
        run: |
          if [ -f tests/test_browser_diagnostics.cjs ]; then
            node --test tests/test_browser_diagnostics.cjs
          fi
  portable-contracts:
    # Standard hosted Linux runners validate portable source contracts promptly.
    # Keep the self-hosted diagnostics job above as a separate qualification gate.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Verify source boundaries and shared-source provenance
        run: python3 scripts/check_observability_coverage.py
      - name: Exercise all diagnostic contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check generated diagrams
        run: python3 docs/current/diagrams/render.py --check
