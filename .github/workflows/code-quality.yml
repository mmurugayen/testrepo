name: Code quality and logging

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned lint tool
        run: python -m pip install "ruff==0.13.1"
      - name: Run syntax and logging gate
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$QUALITY_BASE_SHA" ]; then
            python scripts/quality_gate.py --base "$QUALITY_BASE_SHA"
          else
            python scripts/quality_gate.py
          fi
      - name: Run repository-wide lint
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python -m ruff check . --output-format=concise 2>&1 | tee /tmp/ruff.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "### Automated Ruff remediation report"
              echo
              echo '~~~text'
              sed -n '1,200p' /tmp/ruff.txt
              echo '~~~'
            } > /tmp/ruff-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/ruff-comment.md
          fi
          exit "$status"
